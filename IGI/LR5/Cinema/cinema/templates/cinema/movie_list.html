{% extends 'cinema/base.html' %}
{% load static %}

{% block extra_css %}
<style>
    /* Основные стили */
    .movie-list-container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 20px;
    }

    h1 {
        color: #00adb5;
        text-align: center;
        margin-bottom: 40px;
        font-size: 2.5rem;
        text-transform: uppercase;
    }

    /* Стили для фильтров */
    .filters {
        margin-bottom: 40px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .filters select {
        background: #1a1a1a;
        border: 1px solid #2d2d2d;
        color: #d0d0d0;
        padding: 12px 25px;
        border-radius: 25px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .filters select:hover {
        border-color: #00adb5;
    }

    .filters button {
        background: #00838f;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .filters button:hover {
        background: #006670;
        transform: translateY(-2px);
    }

    /* Сетка фильмов */
    .movies {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 30px;
        padding: 0 20px;
    }

    .movie-card {
        background: #1a1a1a;
        border-radius: 15px;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border: 1px solid #2d2d2d;
        position: relative;
    }

    .movie-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 30px rgba(0, 173, 181, 0.2);
    }

    .movie-card-link {
        text-decoration: none;
        color: inherit;
        display: block;
        height: 100%;
    }

    .movie-card img {
        width: 100%;
        height: 350px;
        object-fit: cover;
        border-bottom: 1px solid #2d2d2d;
        transition: transform 0.3s ease;
    }

    .movie-card:hover img {
        transform: scale(1.05);
    }

    .movie-info {
        padding: 15px;
        position: relative;
        z-index: 2;
        background: linear-gradient(transparent, #1a1a1a 30%);
    }

    .movie-title {
        color: #00adb5;
        margin: 0 0 10px;
        font-size: 1.2rem;
        min-height: 60px;
    }

    .movie-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-size: 0.9rem;
    }

    .rating {
        color: #ffd700;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .genre {
        color: #888;
        padding: 3px 8px;
        border-radius: 15px;
        background: rgba(255,255,255,0.05);
    }

    .movie-description {
        color: #b0b0b0;
        font-size: 0.9rem;
        line-height: 1.4;
        margin: 0;
    }

    @media (max-width: 768px) {
        .filters {
            flex-direction: column;
            align-items: center;
        }
        
        .movies {
            grid-template-columns: 1fr;
        }
        
        h1 {
            font-size: 2rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="movie-list-container">
    <h1>Все фильмы</h1>

    <div class="filters">
        <form method="get">
            <select name="genre">
                <option value="">Все жанры</option>
                {% for genre in genres %}
                <option value="{{ genre.name }}" {% if request.GET.genre == genre.name %}selected{% endif %}>
                    {{ genre.name }}
                </option>
                {% endfor %}
            </select>
            <button type="submit">Применить</button>
        </form>
    </div>

    <div class="movies">
        {% for movie in movies %}
        <div class="movie-card">
            <a href="{% url 'cinema:movie_detail' movie.pk %}" class="movie-card-link">
                <img src="{{ movie.poster.url }}" alt="{{ movie.title }}">
                <div class="movie-info">
                    <h3 class="movie-title">{{ movie.title }}</h3>
                    <div class="movie-meta">
                        <span class="rating"><i class="fas fa-star"></i> {{ movie.rating }}/10</span>
                        <span class="genre">{{ movie.genres.first.name }}</span>
                    </div>
                    <p class="movie-description">{{ movie.description|truncatewords:20 }}</p>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
