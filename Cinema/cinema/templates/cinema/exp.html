{% extends 'cinema/base.html' %}
{% load static %}
{% block content %}
<main class='container py-4'>
    <h1>Генератор текстовых полей</h1>
    <p class="text-muted">Создавайте и настраивайте текстовые поля</p>
    
    <div class="mb-4">
        <button id="add-field-btn" class="btn btn-primary">
            ➕ Добавить текстовое поле
        </button>
    </div>

    <div id="fields-container" class="space-y-3"></div>

    <hr class="my-5">

    <h1>Почтовые посылки</h1>
    <p class="text-muted">Анализ почтовых посылок за последний месяц</p>
    
    <div class="row">
        <div class="col-md-6">
            <h3>Функциональный стиль</h3>
            <form id="functional-form" class="mb-3 p-3 border rounded">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Отправитель" name="sender" required>
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Получатель" name="recipient" required>
                    </div>
                    <div class="col-md-4">
                        <input type="number" class="form-control" placeholder="Вес (кг)" name="weight" step="0.01" required>
                    </div>
                    <div class="col-md-8">
                        <input type="date" class="form-control" name="date" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Добавить посылку</button>
            </form>
            <div class="d-flex gap-2 mb-3">
                <button class="btn btn-warning flex-fill" onclick="functionalManager.generateTestData()">Сгенерировать тестовые данные</button>
                <button class="btn btn-info flex-fill" onclick="functionalManager.displayAll()">Показать все посылки</button>
                <button class="btn btn-success flex-fill" onclick="functionalManager.calculateResult()">Рассчитать результат</button>
            </div>
            <div id="functional-output" class="mt-3"></div>
        </div>

        <div class="col-md-6">
            <h3>Классы ES6</h3>
            <form id="class-form" class="mb-3 p-3 border rounded">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Отправитель" name="sender" required>
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Получатель" name="recipient" required>
                    </div>
                    <div class="col-md-4">
                        <input type="number" class="form-control" placeholder="Вес (кг)" name="weight" step="0.01" required>
                    </div>
                    <div class="col-md-8">
                        <input type="date" class="form-control" name="date" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Добавить посылку</button>
            </form>
            <div class="d-flex gap-2 mb-3">
                <button class="btn btn-warning flex-fill" onclick="classManager.generateTestData()">Сгенерировать тестовые данные</button>
                <button class="btn btn-info flex-fill" onclick="classManager.displayAll()">Показать все посылки</button>
                <button class="btn btn-success flex-fill" onclick="classManager.calculateResult()">Рассчитать результат</button>
            </div>
            <div id="class-output" class="mt-3"></div>
        </div>
    </div>
</main>

<style>
.space-y-3 > * + * {
    margin-top: 1rem;
}

.field-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
}

.field-preview {
    margin-bottom: 1rem;
}

.field-preview input {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card-bg);
    color: var(--card-text);
}

.field-settings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-bottom: 1rem;
}

.field-settings input {
    width: 100%;
    padding: 0.25rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card-bg);
    color: var(--card-text);
}

.field-options {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
}

.field-options label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
}

.field-actions {
    display: flex;
    gap: 0.5rem;
}

.btn {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    flex: 1;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-danger {
    background: #dc2626;
    color: white;
}

.packages-table {
    border-collapse: collapse;
    width: 100%;
    border: 1px solid var(--border);
    font-size: 14px;
    background: var(--card-bg);
    color: var(--card-text);
}

.packages-table th,
.packages-table td {
    padding: 12px 16px;
    border: 1px solid var(--border);
    text-align: left;
    color: var(--card-text);
}

.packages-table thead th {
    background-color: var(--card-bg);
    font-weight: bold;
    color: var(--card-text);
}

.packages-table tbody tr:nth-child(even) {
    background-color: var(--card-bg);
}

.packages-table tbody tr:hover {
    background-color: var(--border);
}

.form-control {
    margin-bottom: 10px;
}

.gap-2 {
    gap: 15px !important;
}

.alert {
    background: var(--card-bg);
    color: var(--card-text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem;
}

.alert-info {
    border-left: 4px solid #0dcaf0;
}

.alert-warning {
    border-left: 4px solid #ffc107;
}

.alert-success {
    border-left: 4px solid #198754;
}

.list-group-item {
    background: var(--card-bg);
    color: var(--card-text);
    border: 1px solid var(--border);
}

.badge {
    background: #2563eb;
    color: white;
}

@media (max-width: 768px) {
    .field-settings {
        grid-template-columns: 1fr;
    }
    
    .field-options {
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .packages-table th,
    .packages-table td {
        padding: 8px 12px;
        font-size: 13px;
    }
    
    .d-flex.gap-2 {
        flex-direction: column;
    }
    
    .d-flex.gap-2 .btn {
        margin-bottom: 10px;
    }
    
    .packages-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }
}
</style>

<script src="{% static 'js/generator.js' %}"></script>
<script src="{% static 'js/packages.js' %}"></script>
{% endblock %}
