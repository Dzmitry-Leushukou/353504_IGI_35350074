{% extends 'cinema/base.html' %}
{% load static %}
{% block content %}
<main class='container py-4'>
    <h1>Генератор текстовых полей</h1>
    <p class="text-muted">Создавайте и настраивайте текстовые поля</p>
    
    <div class="mb-4">
        <button id="add-field-btn" class="btn btn-primary">
            ➕ Добавить текстовое поле
        </button>
    </div>

    <div id="fields-container" class="space-y-3"></div>
</main>

<style>
.space-y-3 > * + * {
    margin-top: 1rem;
}

.field-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
}

.field-preview {
    margin-bottom: 1rem;
}

.field-preview input {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card-bg);
    color: var(--card-text);
}

.field-settings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-bottom: 1rem;
}

.field-settings input {
    width: 100%;
    padding: 0.25rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card-bg);
    color: var(--card-text);
}

.field-options {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
}

.field-options label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
}

.field-actions {
    display: flex;
    gap: 0.5rem;
}

.btn {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    flex: 1;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-danger {
    background: #dc2626;
    color: white;
}

@media (max-width: 768px) {
    .field-settings {
        grid-template-columns: 1fr;
    }
    .field-options {
        flex-direction: column;
        gap: 0.5rem;
    }
}
</style>

<script src="{% static 'js/generator.js' %}"></script>
{% endblock %}
