
{% extends "cinema/base.html" %}
{% load static %}
{% block content %}
<main class="container py-4">
  <h1 class="mb-3">Фильмы</h1>

  <div class="d-flex align-items-center gap-2 mb-3">
    <label class="form-label m-0">На странице:</label>
    <select id="per-page" class="form-select" style="width:auto">
      <option>3</option><option>6</option><option>9</option>
    </select>
  </div>
  <div id="catalog" class="row g-4"></div>
  <nav class="my-3"><ul id="catalog-pager" class="pagination"></ul></nav>
</main>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
.card-3d{ perspective:1000px; }
.card-3d .inner{ transition: transform .15s ease; transform-style: preserve-3d; }
.card-3d:hover .inner{ transform: rotateY(8deg) rotateX(4deg) translateZ(8px); }
</style>
<script src="{% static 'js/lr3_catalog.js' %}"></script>
{% endblock %}
