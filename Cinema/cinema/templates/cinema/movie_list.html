<!DOCTYPE html>
{% extends 'cinema/base.html' %}
{% load static %}

{% block content %}

<style>
  .movies{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 28px; 
  }
  @media (max-width: 1200px){ .movies{ grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px){  .movies{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px){  .movies{ grid-template-columns: 1fr; } }

  .movie-card{
    background: #131d20;
    border: 1px solid #263450;
    border-radius: 12px;
    overflow: hidden;   
    box-shadow: 0 6px 16px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    height: 100%;
  }

.movie-card h3{ color:#fff; }
.movie-card .movie-meta{ color:#cbd5e1; }
.movie-card .movie-description{ color:#e9f1f5; }
.movie-card a{ color:#8bd3ff; }      
.movie-card a:hover{ color:#b6e7ff; }  
.movie-card-link{
    display: block;
    color: inherit;
    text-decoration: none;
  }

  .movie-card img{
    width: 100%;
    height: 320px;      
    object-fit: cover; 
    display: block;
  }

  .movie-info{
    padding: 12px;
    overflow-wrap: anywhere; 
    word-break: break-word;
    display: grid;
    gap: 8px;
  }

  .movie-description{
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .movie-list-container{
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px;
  }
</style>


<div class="movie-list-container">
    <h1>Все фильмы</h1>

    <div class="filters">
        <form method="get">
            <select name="genre">
                <option value="">Все жанры</option>
                {% for genre in genres %}
                <option value="{{ genre.name }}" {% if request.GET.genre == genre.name %}selected{% endif %}>
                    {{ genre.name }}
                </option>
                {% endfor %}
            </select>
            <button type="submit">Применить</button>
        </form>
    </div>

    <div class="movies">
        {% for movie in movies %}
        <div class="movie-card">
            <a href="{% url 'cinema:movie_detail' movie.pk %}" class="movie-card-link">
                <img src="{{ movie.poster.url }}" alt="{{ movie.title }}">
                <div class="movie-info">
                    <h3 class="movie-title">{{ movie.title }}</h3>
                    <div class="movie-meta">
                        <span class="rating"><i class="fas fa-star"></i> {{ movie.rating }}/10</span>
                        <span class="genre">{{ movie.genres.first.name }}</span>
                    </div>
                    <p class="movie-description">{{ movie.description|truncatewords:20 }}</p>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
