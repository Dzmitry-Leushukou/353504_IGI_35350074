{# templates/cinema/news_detail.html #}
{% extends 'cinema/base.html' %}
{% load static %}

{% block content %}
<style>
  .news-detail{
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .news-detail .news-image{
    max-width: 900px;
    margin: 8px auto 14px;
    border-radius: 12px;
    overflow: hidden;
  }
  .news-detail .news-image img{
    width: 100%;
    height: auto;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
  }

  .news-detail .news-content{
    display: block;                 
    column-width: 380px;            
    -webkit-column-width: 380px;
    -moz-column-width: 380px;
    column-gap: 32px;
    column-fill: balance;

    word-break: normal;
    overflow-wrap: anywhere;        
    hyphens: auto;                 
    line-height: 1.65;
    text-align: left;              
  }
  .news-detail .news-content p{ margin: 0 0 1em; }
  .news-detail .news-content img,
  .news-detail .news-content figure,
  .news-detail .news-content blockquote,
  .news-detail .news-content table{
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
  }
  .news-detail .news-content h2,
  .news-detail .news-content h3{
    column-span: all;
    -webkit-column-span: all;
    margin: .8em 0 .4em;
  }

  @media (max-width: 900px){
    .news-detail .news-content{
      column-width: auto;
      -webkit-column-width: auto;
      -moz-column-width: auto;
      column-count: 1;
      -webkit-column-count: 1;
      -moz-column-count: 1;
    }
  }

  .back-link{
    display:inline-block;margin:12px 0;text-decoration:none;
    border:1px solid #263450;border-radius:10px;padding:6px 10px
  }
  .back-link:hover{ text-decoration:underline }
</style>

<div class="news-detail">
  <h1>{{ news.title }}</h1>
  <p class="news-date">{{ news.publish_date|date:"d.m.Y H:i" }}</p>

  <div class="news-image">
    <img src="{{ news.image.url }}" alt="{{ news.title }}">
  </div>

  {# lang="ru" помогает hyphens:auto для кириллицы #}
  <div class="news-content" lang="ru">
    {{ news.full_text|linebreaks }}
  </div>

  <a href="{% url 'cinema:news_list' %}" class="back-link">Все новости</a>
</div>
{% endblock %}
